<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snap-to-Fix — Product Demo</title>
    <meta name="description" content="Watch the 47-second Snap-to-Fix product demo, then try the interactive prototype." />
    <meta property="og:title" content="Snap-to-Fix — See the problem. Know the fix." />
    <meta property="og:description" content="A 47-second look at the visual diagnostic assistant for everyday repairs." />
    <meta property="og:image" content="./snap-to-fix-demo-poster.png" />
    <style>
      :root { --ink:#17231f; --paper:#fbfaf5; --lime:#c8f169; --orange:#ff784a; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; color:var(--paper); background:var(--ink); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      main { width:min(1220px,calc(100% - 32px)); margin:auto; padding:32px 0 54px; }
      header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:30px; }
      .brand { display:flex; align-items:center; gap:12px; color:white; font-weight:800; font-size:20px; letter-spacing:-.03em; text-decoration:none; }
      .mark { width:32px; height:32px; display:grid; place-items:center; background:var(--lime); color:var(--ink); clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%); font-size:13px; }
      .tag { color:#a8b5ae; font:11px ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.1em; text-transform:uppercase; }
      .intro { display:flex; align-items:end; justify-content:space-between; gap:32px; margin:0 0 28px; }
      h1 { max-width:820px; margin:0; color:white; font-size:clamp(44px,7vw,88px); line-height:.94; letter-spacing:-.065em; }
      h1 em { color:var(--lime); font-style:normal; font-weight:500; }
      .intro p { max-width:350px; margin:0; color:#aab7b0; font-size:16px; line-height:1.6; }
      .player { overflow:hidden; border:1px solid rgba(255,255,255,.18); border-radius:14px; background:#090f0c; box-shadow:0 30px 90px rgba(0,0,0,.34); }
      video { display:block; width:100%; aspect-ratio:16/9; background:#090f0c; }
      .actions { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:22px; }
      .button { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 20px; border-radius:5px; color:var(--ink); background:var(--lime); font-weight:800; text-decoration:none; }
      .button.secondary { color:white; background:transparent; border:1px solid rgba(255,255,255,.25); }
      .note { margin-left:auto; color:#8d9b94; font-size:12px; }
      @media (max-width:760px) { .intro { display:block; } .intro p { margin-top:20px; } .tag { display:none; } .note { width:100%; margin:4px 0 0; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="./"><span class="mark">≡</span>Snap-to-Fix</a>
        <span class="tag">47-second product demo · 1080p</span>
      </header>
      <section class="intro">
        <h1>See the problem.<br /><em>Know the fix.</em></h1>
        <p>Watch how one visible clue becomes a plain-English diagnosis, a safety decision, and a practical next step.</p>
      </section>
      <div class="player">
        <video controls preload="metadata" poster="./snap-to-fix-demo-poster.png">
          <source src="./snap-to-fix-demo.mp4" type="video/mp4" />
          Your browser does not support embedded video.
        </video>
      </div>
      <div class="actions">
        <a class="button" href="./snap-to-fix-demo.mp4" download="Snap-to-Fix-Demo-1080p.mp4">Download HD video ↓</a>
        <a class="button secondary" href="./">Try the interactive prototype ↗</a>
        <span class="note">H.264 MP4 · 1920×1080 · captions included</span>
      </div>
    </main>
  </body>
</html>
